<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Barcode - Chemical Inventory</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #F8F9FB; color: #2B2F36; padding: 16px;
  }
  .card {
    background: #fff; border: 1px solid #E7EAEE; border-radius: 14px;
    box-shadow: 0 2px 10px rgba(30,35,45,.06); padding: 18px; max-width: 480px;
    margin: 0 auto 14px;
  }
  h1 { font-size: 18px; margin: 0 0 14px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #767E8C; margin-bottom: 5px; }
  input, select {
    width: 100%; border: 1px solid #E7EAEE; border-radius: 9px; padding: 10px 12px;
    font-size: 14px; margin-bottom: 12px; font-family: inherit;
  }
  input[readonly] { background: #F8F9FB; }
  button {
    border: none; border-radius: 9px; padding: 11px 16px; font-size: 14px; font-weight: 600;
    cursor: pointer; width: 100%; font-family: inherit;
  }
  .btn-primary { background: #7FA99B; color: #fff; }
  .btn-secondary { background: #F1F4F2; color: #2B2F36; border: 1px solid #E7EAEE; margin-bottom: 10px; }
  .msg { padding: 10px 12px; border-radius: 9px; font-size: 13px; margin-bottom: 12px; display: none; }
  .msg-error { background: #FDE4E4; color: #B4383D; }
  .msg-success { background: #E3F4EA; color: #2E8B57; }
  #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  .hint { font-size: 11px; color: #767E8C; margin-top: -6px; margin-bottom: 12px; }
  #logout-btn { background: none; border: none; color: #767E8C; font-size: 12px; text-decoration: underline; width: auto; padding: 0; float: right; }
</style>
</head>
<body>

  <!-- ====== KONFIGURASI: ganti URL ini dengan URL deployment Web App kamu ====== -->
  <script>
    var API_URL = 'https://script.google.com/macros/s/AKfycbzFdQWM6yijvhpNZsDLuN4_VbZ2FkWiu4LTht7-XGJFq3-upUOrC9nM8LpHSKHlyBRdiw/exec'; // contoh: https://script.google.com/macros/s/AKfycb.../exec
  </script>

  <div id="login-card" class="card">
    <h1>Login - Scan Barcode</h1>
    <form id="login-form">
      <div class="msg msg-error" id="login-err"></div>
      <label>Email</label>
      <input type="email" id="login-email" name="username" autocomplete="username">
      <label>Password</label>
      <input type="password" id="login-password" name="password" autocomplete="current-password">
      <button class="btn-primary" type="submit" id="login-btn">Masuk</button>
    </form>
  </div>

  <div id="scan-card" class="card" style="display:none;">
    <button id="logout-btn">Logout</button>
    <h1>Scan Barcode</h1>
    <div class="msg msg-error" id="scan-err"></div>
    <div class="msg msg-success" id="scan-ok"></div>

    <div id="reader"></div>
    <button class="btn-secondary" id="start-btn">Mulai Scan</button>
    <button class="btn-secondary" id="stop-btn" style="display:none;">Berhenti</button>

    <label>Atau masukkan manual (Kode-Batch)</label>
    <input type="text" id="manual-input" placeholder="CH0001-Z0908956">
    <button class="btn-secondary" id="manual-btn">Cari</button>
  </div>

  <div id="form-card" class="card" style="display:none;">
    <h1>Form Transaksi</h1>
    <div class="msg msg-error" id="form-err"></div>

    <label>Kode</label>
    <input type="text" id="f-kode" readonly>
    <label>Nama</label>
    <input type="text" id="f-nama" readonly>

    <label>Jenis Transaksi</label>
    <select id="f-jenis">
      <option value="Masuk">Masuk</option>
      <option value="Keluar">Keluar</option>
    </select>

    <div id="f-batch-masuk-wrap">
      <label>Batch</label>
      <input type="text" id="f-batch-masuk">
    </div>
    <div id="f-batch-keluar-wrap" style="display:none;">
      <label>Batch (sisa stok tersedia)</label>
      <select id="f-batch-keluar"></select>
    </div>
    <div id="f-expired-wrap">
      <label>Expired</label>
      <input type="date" id="f-expired">
    </div>

    <label>Jumlah</label>
    <input type="number" id="f-jumlah" min="0" step="0.01">
    <label>Tujuan Penggunaan</label>
    <input type="text" id="f-tujuan">
    <label>Keterangan</label>
    <input type="text" id="f-keterangan">

    <button class="btn-primary" id="f-submit-btn">Submit Transaksi</button>
    <button class="btn-secondary" id="f-cancel-btn" style="margin-top:8px;">Batal / Scan Lagi</button>
  </div>

<script>
(function () {
  'use strict';
  var token = localStorage.getItem('scanner_token');
  var currentBatches = [];
  var html5QrCode = null;

  function showMsg(id, text) {
    var el = document.getElementById(id);
    if (!text) { el.style.display = 'none'; return; }
    el.textContent = text;
    el.style.display = 'block';
  }

  function api(action, payload) {
    // Kirim sebagai form-urlencoded (URLSearchParams) TANPA header custom --
    // browser otomatis pakai Content-Type "application/x-www-form-urlencoded"
    // yang termasuk "simple request" di spesifikasi CORS, jadi tidak memicu
    // preflight OPTIONS. Apps Script Web App tidak bisa menjawab preflight
    // OPTIONS, jadi kalau request memicu preflight (mis. body JSON dengan
    // header Content-Type: application/json), browser akan block dengan
    // error CORS walau server sebenarnya baik-baik saja.
    var params = new URLSearchParams();
    params.append('action', action);
    if (token) params.append('token', token);
    Object.keys(payload || {}).forEach(function (k) {
      var v = payload[k];
      params.append(k, (v !== null && typeof v === 'object') ? JSON.stringify(v) : (v == null ? '' : String(v)));
    });
    return fetch(API_URL, {
      method: 'POST',
      body: params
    }).then(function (res) { return res.json(); });
  }

  function showScreen(id) {
    ['login-card', 'scan-card', 'form-card'].forEach(function (s) {
      document.getElementById(s).style.display = (s === id) ? '' : 'none';
    });
  }

  var pendingKode = null; // dari QR label (?kode=...), diproses setelah pasti login

  function boot() {
    var urlParams = new URLSearchParams(window.location.search);
    var urlToken = urlParams.get('token');
    var urlKode = urlParams.get('kode');
    if (urlKode) pendingKode = urlKode;
    if (urlToken) {
      token = urlToken;
      localStorage.setItem('scanner_token', token);
    }
    // Bersihkan query string dari address bar (token/kode) supaya tidak
    // ke-share/ke-bookmark dengan data sensitif atau kode basi.
    if (urlToken || urlKode) window.history.replaceState({}, document.title, window.location.pathname);

    if (!API_URL || API_URL.indexOf('PASANG_URL') !== -1) {
      showScreen('login-card');
      showMsg('login-err', 'API_URL belum di-set di file ini.');
      return;
    }
    if (!token) {
      showScreen('login-card');
      if (pendingKode) showMsg('login-err', 'Login dulu untuk melanjutkan input transaksi Kode ' + pendingKode + '.');
      return;
    }
    api('whoami', {}).then(function (res) {
      if (!res.success) {
        token = null;
        localStorage.removeItem('scanner_token');
        showScreen('login-card');
        if (pendingKode) showMsg('login-err', 'Sesi berakhir, login dulu untuk melanjutkan Kode ' + pendingKode + '.');
        return;
      }
      afterLoginReady();
    }).catch(function () {
      afterLoginReady();
    });
  }

  // Dipanggil setelah dipastikan sudah login (baik dari token URL/tersimpan,
  // maupun baru saja submit form login) -- kalau ada kode pending dari QR
  // label, langsung lanjut ke situ tanpa perlu scan/ketik ulang.
  // Dipanggil setelah dipastikan sudah login (baik dari token URL/tersimpan,
  // maupun baru saja submit form login) -- kalau ada kode pending dari QR
  // label, langsung lanjut ke situ tanpa perlu scan/ketik ulang. Kalau
  // tidak, langsung nyalakan kamera otomatis -- tidak perlu klik "Mulai
  // Scan" manual supaya alurnya tidak terasa lama.
  function afterLoginReady() {
    showScreen('scan-card');
    if (pendingKode) {
      var kode = pendingKode;
      pendingKode = null;
      handleScanResult(kode);
    } else {
      startScan();
    }
  }

  // ---------- Login ----------
  // Pakai event 'submit' dari <form> asli -- ini yang bikin Safari/iOS &
  // browser lain mau menawarkan "Simpan Password?". Tombol type="submit"
  // otomatis memicu event ini saat diklik.
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;
    if (!email || !password) { showMsg('login-err', 'Email dan password wajib diisi.'); return; }
    if (!API_URL || API_URL.indexOf('PASANG_URL') !== -1) {
      showMsg('login-err', 'API_URL belum di-set di file ini. Edit baris "PASANG_URL_WEB_APP_DI_SINI".');
      return;
    }
    api('login', { email: email, password: password }).then(function (res) {
      if (!res.success) { showMsg('login-err', res.message || 'Login gagal.'); return; }
      token = res.token;
      localStorage.setItem('scanner_token', token);
      showMsg('login-err', null);
      afterLoginReady();
    }).catch(function (err) {
      showMsg('login-err', 'Gagal menghubungi server: ' + err.message);
    });
  });

  document.getElementById('logout-btn').addEventListener('click', function () {
    stopScan();
    token = null;
    localStorage.removeItem('scanner_token');
    showScreen('login-card');
  });

  // ---------- Scan ----------
  // scanBusy mencegah dobel start. cachedCamId disimpan setelah deteksi
  // kamera pertama kali sukses -- supaya restart berikutnya (tiap habis
  // submit) tidak perlu enumerasi ulang daftar kamera (Html5Qrcode.getCameras()
  // bisa memakan waktu nyata di beberapa HP), jadi terasa lebih responsif.
  var scanBusy = false;
  var cachedCamId = null;
  var retriedOnce = false;

  function startScan() {
    if (scanBusy || html5QrCode) return;
    scanBusy = true;
    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('stop-btn').style.display = '';
    showMsg('scan-err', null);
    var instance = new Html5Qrcode('reader');
    html5QrCode = instance;

    var camIdPromise = cachedCamId
      ? Promise.resolve(cachedCamId)
      : Html5Qrcode.getCameras().then(function (cameras) {
          if (!cameras || !cameras.length) throw new Error('Tidak ada kamera terdeteksi.');
          var backCam = cameras.find(function (c) { return /back|belakang|rear|environment/i.test(c.label); });
          cachedCamId = backCam ? backCam.id : cameras[cameras.length - 1].id;
          return cachedCamId;
        });

    camIdPromise.then(function (camId) {
      return instance.start(camId, { fps: 10, qrbox: 220 }, function (text) {
        handleScanResult(text);
      }, function () {});
    }).then(function () {
      scanBusy = false;
      retriedOnce = false;
    }).catch(function (err) {
      scanBusy = false;
      html5QrCode = null;
      cachedCamId = null;
      // NotReadableError biasanya cuma soal timing (kamera belum sempat
      // benar-benar dilepas OS) -- coba sekali lagi otomatis dengan jeda
      // lebih panjang sebelum menyerah ke tombol manual.
      if (err && err.name === 'NotReadableError' && !retriedOnce) {
        retriedOnce = true;
        setTimeout(startScan, 1200);
        return;
      }
      retriedOnce = false;
      document.getElementById('start-btn').style.display = '';
      document.getElementById('start-btn').textContent = 'Ketuk untuk Mulai Scan';
      document.getElementById('stop-btn').style.display = 'none';
      // Tampilkan pesan error ASLI dari browser -- jangan ditimpa tebakan
      // generik, karena penyebabnya bisa macam-macam (kamera belum sempat
      // dilepas browser lain, izin ditolak, device tidak mendukung, dll)
      // dan pesan generik yang salah cuma bikin sulit didiagnosis.
      var detail = (err && (err.name || err.message)) ? (err.name ? err.name + ': ' : '') + (err.message || err) : String(err);
      showMsg('scan-err', 'Gagal mengaktifkan kamera (' + detail + ') -- ketuk tombol di atas untuk coba lagi.');
    });
  }

  // Restart kamera dengan jeda singkat -- beberapa browser (terutama Safari
  // iOS) butuh waktu sesaat untuk benar-benar melepas kamera sebelum bisa
  // dipakai lagi; restart yang terlalu instan sering gagal dengan error
  // "kamera sedang dipakai" walau instance lama sudah di-stop().
  function startScanDelayed() {
    setTimeout(startScan, 700);
  }

  document.getElementById('start-btn').addEventListener('click', startScan);
  document.getElementById('stop-btn').addEventListener('click', function () { stopScan(); });

  function stopScan() {
    document.getElementById('start-btn').style.display = '';
    document.getElementById('stop-btn').style.display = 'none';
    if (!html5QrCode) { releaseCameraHard_(); return; }
    var instance = html5QrCode;
    html5QrCode = null;
    instance.stop().then(function () {
      return instance.clear();
    }).catch(function () {
      // Kamera mungkin sudah berhenti sendiri (mis. tab pindah) -- tetap
      // coba clear() supaya div #reader bersih untuk start berikutnya.
      try { instance.clear(); } catch (e2) { /* diamkan */ }
    }).then(releaseCameraHard_, releaseCameraHard_);
  }

  // Jaring pengaman: .stop() bawaan library kadang tidak benar-benar
  // melepas hardware kamera tepat waktu (inilah penyebab NotReadableError
  // "kamera masih dipakai" waktu start berikutnya, baik di tab yang sama
  // maupun tab baru). Cari langsung elemen <video> di dalam #reader dan
  // matikan track-nya secara manual, independen dari cleanup internal
  // library.
  function releaseCameraHard_() {
    var videos = document.querySelectorAll('#reader video');
    videos.forEach(function (v) {
      if (v.srcObject) {
        try { v.srcObject.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { /* diamkan */ }
        v.srcObject = null;
      }
    });
  }

  // Kalau tab/halaman ini disembunyikan (pindah tab, minimize, dsb),
  // lepas kamera otomatis -- mencegah kamera "terkunci" di tab yang
  // ditinggalkan, yang bisa bikin tab lain (mis. dibuka lagi lewat tombol
  // "buka halaman scanner" di web aplikasi) gagal NotReadableError.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopScan();
  });

  document.getElementById('manual-btn').addEventListener('click', function () {
    var val = document.getElementById('manual-input').value.trim();
    if (val) handleScanResult(val);
  });

  // Kalau URL Halaman Scanner sudah diisi di Settings, isi QR yang di-scan
  // bukan cuma "Kode-Batch" pendek lagi, tapi URL LENGKAP
  // (https://.../scanner.html?kode=Kode-Batch). Memecah SELURUH URL pakai
  // '-' itu keliru -- kalau URL-nya sendiri mengandung tanda '-' di mana
  // pun (nama repo GitHub Pages, dll), hasil Kode/Batch jadi kacau. Jadi
  // kalau teksnya berbentuk URL, ambil dulu nilai parameter ?kode=
  // dengan benar, baru dipecah jadi Kode+Batch.
  function extractKodeBatch_(text) {
    var raw = (text || '').trim();
    var kodeBatch = raw;
    if (/^https?:\/\//i.test(raw)) {
      try {
        var url = new URL(raw);
        var param = url.searchParams.get('kode');
        if (param) kodeBatch = param;
      } catch (e) { /* bukan URL valid, pakai teks apa adanya */ }
    }
    var parts = kodeBatch.split('-');
    return { kode: parts[0], batch: parts.slice(1).join('-') };
  }

  function handleScanResult(text) {
    var extracted = extractKodeBatch_(text);
    var kode = extracted.kode;
    showMsg('scan-err', null);
    api('lookupKode', { kode: kode }).then(function (res) {
      if (!res.success) { showMsg('scan-err', res.message); return; }
      stopScan();
      currentBatches = res.batches;
      document.getElementById('f-kode').value = res.chemical.Kode;
      document.getElementById('f-nama').value = res.chemical.Nama;
      // Scan dari botol SELALU berarti "Keluar" -- kalau ada label barcode
      // di botolnya, artinya barang itu sudah pasti pernah di-"Masuk"-kan
      // (labelnya baru dibuat setelah barang tercatat). "Masuk" (barang
      // baru) dilakukan lewat web aplikasi langsung, bukan lewat scan.
      document.getElementById('f-jenis').value = 'Keluar';
      document.getElementById('f-batch-masuk').value = extracted.batch;
      document.getElementById('f-jumlah').value = '';
      document.getElementById('f-tujuan').value = '';
      document.getElementById('f-keterangan').value = '';
      updateJenisUI();
      applyAutoExpired();
      showMsg('scan-ok', 'Kode ' + res.chemical.Kode + ' ditemukan.');
      showScreen('form-card');
    }).catch(function (err) {
      showMsg('scan-err', 'Gagal mencari kode: ' + err.message);
    });
  }

  // ---------- Form transaksi ----------
  document.getElementById('f-jenis').addEventListener('change', updateJenisUI);
  document.getElementById('f-batch-masuk').addEventListener('input', function () {
    clearTimeout(window._expTimer);
    window._expTimer = setTimeout(applyAutoExpired, 150);
  });

  function updateJenisUI() {
    var jenis = document.getElementById('f-jenis').value;
    document.getElementById('f-batch-masuk-wrap').style.display = jenis === 'Masuk' ? '' : 'none';
    document.getElementById('f-expired-wrap').style.display = jenis === 'Masuk' ? '' : 'none';
    document.getElementById('f-batch-keluar-wrap').style.display = jenis === 'Keluar' ? '' : 'none';
    if (jenis === 'Keluar') {
      var tersedia = currentBatches.filter(function (b) { return Number(b.Qty) > 0; });
      var sel = document.getElementById('f-batch-keluar');
      sel.innerHTML = tersedia.map(function (b) {
        return '<option value="' + b.Batch + '">' + b.Batch + ' (sisa: ' + b.Qty + ' ' + b.Satuan + ')</option>';
      }).join('');
      // Botol yang di-scan sudah pasti batch tertentu -- langsung pilihkan
      // itu di dropdown, jangan biarkan default ke pilihan pertama (itu
      // salah satu sumber "salah input" yang dilaporkan).
      var scannedBatch = document.getElementById('f-batch-masuk').value.trim();
      if (scannedBatch && tersedia.some(function (b) { return String(b.Batch) === scannedBatch; })) {
        sel.value = scannedBatch;
        showMsg('scan-err', null);
      } else if (scannedBatch) {
        // Batch yang di-scan tidak ada di daftar stok tersedia (mis. sudah
        // habis/qty 0) -- jangan diam-diam biarkan user pilih batch lain
        // yang berbeda dari botol yang dipegangnya.
        showMsg('scan-err', 'Perhatian: batch "' + scannedBatch + '" tidak ditemukan atau stoknya sudah 0. Pastikan pilih batch yang benar di bawah, atau cek fisik botolnya.');
      }
    } else {
      applyAutoExpired();
    }
  }

  // Kalau Kode+Batch yang diketik/discan sudah ada di Master Stock (restock
  // batch lama), Expired otomatis diisi dari data yang tersimpan dan
  // field-nya dikunci -- tidak perlu diketik manual lagi.
  function applyAutoExpired() {
    var batch = document.getElementById('f-batch-masuk').value.trim();
    var expiredInput = document.getElementById('f-expired');
    var existing = currentBatches.filter(function (b) { return String(b.Batch) === batch; })[0];
    if (batch && existing) {
      // Beberapa data lama diisi "-" (bukan benar-benar dikosongkan) di
      // kolom Expired -- new Date("-") menghasilkan Invalid Date, dan
      // .toISOString() pada Invalid Date MELEMPAR ERROR ("Invalid time
      // value"), bukan cuma menghasilkan string kosong. Makanya wajib
      // divalidasi dulu, apapun isi teksnya.
      var expDate = existing.Expired ? new Date(existing.Expired) : null;
      expiredInput.value = (expDate && !isNaN(expDate.getTime())) ? expDate.toISOString().slice(0, 10) : '';
      expiredInput.readOnly = true;
      expiredInput.style.background = '#F8F9FB';
    } else {
      expiredInput.readOnly = false;
      expiredInput.style.background = '';
    }
  }

  document.getElementById('f-cancel-btn').addEventListener('click', function () {
    showMsg('scan-ok', null);
    showScreen('scan-card');
    startScanDelayed();
  });

  document.getElementById('f-submit-btn').addEventListener('click', function () {
    var jenis = document.getElementById('f-jenis').value;
    var kode = document.getElementById('f-kode').value;
    var batch = jenis === 'Masuk' ? document.getElementById('f-batch-masuk').value.trim() : document.getElementById('f-batch-keluar').value;
    var jumlah = document.getElementById('f-jumlah').value;
    if (!batch) { showMsg('form-err', 'Batch wajib diisi.'); return; }
    if (!jumlah || Number(jumlah) <= 0) { showMsg('form-err', 'Jumlah harus lebih dari 0.'); return; }

    var btn = document.getElementById('f-submit-btn');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    api('addTransaksi', {
      data: {
        Kode: kode, JenisTransaksi: jenis, Jumlah: Number(jumlah),
        Batch: batch, Expired: document.getElementById('f-expired').value,
        TujuanPenggunaan: document.getElementById('f-tujuan').value.trim(),
        Keterangan: document.getElementById('f-keterangan').value.trim()
      }
    }).then(function (res) {
      btn.disabled = false; btn.textContent = 'Submit Transaksi';
      if (!res.success) { showMsg('form-err', res.message); return; }
      showMsg('form-err', null);
      showMsg('scan-ok', 'Transaksi tersimpan. Sisa stok: ' + res.sisaStok);
      showScreen('scan-card');
      document.getElementById('manual-input').value = '';
      // Langsung siap scan botol berikutnya -- tidak perlu klik "Mulai Scan"
      // manual lagi tiap kali selesai submit.
      startScanDelayed();
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = 'Submit Transaksi';
      showMsg('form-err', 'Gagal submit: ' + err.message);
    });
  });

  boot();
})();
</script>
</body>
</html>
